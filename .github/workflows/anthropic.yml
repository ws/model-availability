name: Scrape Anthropic model catalog

on:
  schedule:
    # Every day at 03:00 UTC — staggered from AWS (00:00), Azure (01:00), and
    # Google (02:00) so the workflows don't race on the commit/push.
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      accept_pending:
        description: "Accept the drift recorded in the pending-drift marker"
        type: boolean
        default: false
      allow_drift:
        description: "Accept ALL drift, even unrecorded (blanket --allow-drift)"
        type: boolean
        default: false

permissions:
  contents: write # push the updated snapshots back to the repo
  id-token: write # mint the GitHub OIDC token exchanged via Anthropic WIF

concurrency:
  group: scrape-anthropic
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # Check out the branch tip, not the run's original SHA: a re-run of a
          # failed drift run must see the pending-drift marker that the failed
          # attempt committed (the ack-by-re-run handshake below).
          ref: main

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          # Cache downloaded wheels between runs; key on the scripts' inline
          # (PEP 723) dependency blocks so it invalidates when deps change.
          enable-cache: true
          cache-dependency-glob: "scripts/providers/anthropic/*.py"

      # Keyless auth via Anthropic Workload Identity Federation: mint the
      # GitHub Actions OIDC JWT, and the anthropic SDK exchanges it at
      # /v1/oauth/token for a short-lived token. No API key stored anywhere.
      # The audience must equal the federation rule's match.audience
      # (https://api.anthropic.com, set by the Console's Connect-workload wizard).
      - name: Mint GitHub OIDC token
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const token = await core.getIDToken('https://api.anthropic.com');
            core.setSecret(token);
            require('fs').writeFileSync(
              `${process.env.RUNNER_TEMP}/anthropic_oidc_token`, token);

      # The federation/org/service-account ids are identifiers, not
      # credentials — repo Variables, not secrets.
      - name: Scrape Anthropic models
        env:
          ANTHROPIC_FEDERATION_RULE_ID: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
          ANTHROPIC_ORGANIZATION_ID: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
          ANTHROPIC_SERVICE_ACCOUNT_ID: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
          ANTHROPIC_WORKSPACE_ID: ${{ vars.ANTHROPIC_WORKSPACE_ID }}
          ANTHROPIC_IDENTITY_TOKEN_FILE: ${{ runner.temp }}/anthropic_oidc_token
        # The human acknowledgement of recorded drift is a re-run of the failed
        # run (one tap in the GitHub mobile app) or a manual dispatch with the
        # accept_pending box ticked. Scheduled runs never accept, so
        # unacknowledged drift keeps failing daily. On a schedule the inputs
        # context is empty, so both expressions fall through to no flag.
        run: >
          uv run scripts/providers/anthropic/list_models.py
          ${{ (github.run_attempt > 1 || inputs.accept_pending) && '--accept-pending' || '' }}
          ${{ inputs.allow_drift && '--allow-drift' || '' }}

      # Drift-ack handshake, step 1: a drift failure above recorded exactly
      # what it saw in a pending-drift marker. Commit it so the next re-run
      # checks it out and accepts exactly that drift. Auth/network failures
      # write no marker, so this stages nothing and stays a no-op.
      - name: Commit pending-drift marker
        if: failure()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          find data/providers/anthropic -name '*.pending-drift.json' -exec git add -- {} +
          if git diff --staged --quiet; then
            echo "No pending-drift marker to commit."
            exit 0
          fi
          git commit -m "Anthropic: record pending drift (re-run the workflow to accept)"
          git pull --rebase --autostash
          git push

      - name: Stage and summarize changes
        id: summary
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/providers/anthropic
          if git diff --staged --quiet; then
            echo "No catalog changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          # Deterministic commit message: counts in the subject, ids in the body.
          python3 scripts/diff_summary.py data/providers/anthropic/models.json --title "Anthropic model catalog" > "$RUNNER_TEMP/commit_msg.txt"

      - name: Commit and push
        if: steps.summary.outputs.changed == 'true'
        run: |
          git commit -F "$RUNNER_TEMP/commit_msg.txt"
          git pull --rebase --autostash
          git push
