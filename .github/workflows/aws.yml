name: Scrape AWS model catalogs

on:
  schedule:
    # Every day at 00:00 UTC. Cron on GitHub Actions is best-effort and may be
    # delayed under load; exact timing isn't important for a daily snapshot.
    # Staggered from the Google workflow to avoid racing on the commit/push.
    - cron: "0 0 * * *"
  workflow_dispatch: {}

permissions:
  contents: write # push the updated snapshots back to the repo
  id-token: write # mint the OIDC token used to assume the AWS role

# Never run two AWS scrapes concurrently (a manual run during a scheduled one
# would otherwise race on the commit/push).
concurrency:
  group: scrape-aws
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: us-east-1
      # Project id is an identifier, not a credential — a repo variable, not a
      # secret. Set it under Settings > Secrets and variables > Actions > Variables.
      AWS_BEDROCK_MANTLE_PROJECT_ID: ${{ vars.AWS_BEDROCK_MANTLE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # OIDC: assume an AWS role via short-lived credentials — no access keys
      # stored in the repo. The role ARN is a repo secret; configure-aws-
      # credentials exports the temporary creds into the environment for boto3.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@517a711dbcd0e402f90c77e7e2f81e849156e31d # v6.2.2
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          # Cache downloaded wheels between runs; key on the scripts' inline
          # (PEP 723) dependency blocks so it invalidates when deps change.
          enable-cache: true
          cache-dependency-glob: "scripts/providers/bedrock/*.py"

      # Invoke via `uv run` (not the shebang) so credentials come from the
      # assumed-role env and no .env file is written to the runner's disk.
      - name: Scrape Bedrock foundation models
        run: uv run scripts/providers/bedrock/list_foundation_models.py

      - name: Scrape Bedrock mantle models
        run: uv run scripts/providers/bedrock/list_mantle_models.py

      - name: Stage and summarize changes
        id: summary
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/providers/bedrock
          if git diff --staged --quiet; then
            echo "No catalog changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          # Deterministic commit message: counts in the subject, ids in the body.
          python3 scripts/diff_summary.py data/providers/bedrock/foundation_models.json data/providers/bedrock/mantle_models.json --title "AWS model catalogs" > "$RUNNER_TEMP/commit_msg.txt"

      - name: Commit and push
        if: steps.summary.outputs.changed == 'true'
        run: |
          git commit -F "$RUNNER_TEMP/commit_msg.txt"
          git pull --rebase --autostash
          git push
